version: 2
project_name: moltbunker

# NOTE (release-toolchain debt): the `archives.format`, `brews`, and `dockers`
# stanzas below use properties deprecated upstream (slated for hard removal in a
# later v2). This is why release.yml + the release-lint CI job pin GoReleaser to
# `~> v2.4`. Migration path (archives.format -> formats, brews ->
# homebrew_casks, dockers -> dockers_v2) and the Windows-archive blocker are
# tracked in docs/release-integrity.md ("Known release-toolchain debt").

before:
  hooks:
    - go mod tidy

builds:
  - id: daemon
    binary: moltbunker-daemon
    main: ./cmd/daemon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: cli
    binary: moltbunker
    main: ./cmd/cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/moltbunker/moltbunker/cmd/cli/commands.Version={{.Version}}
      - -X github.com/moltbunker/moltbunker/cmd/cli/commands.Commit={{.Commit}}
      - -X github.com/moltbunker/moltbunker/cmd/cli/commands.BuildDate={{.Date}}

  - id: api
    binary: moltbunker-api
    main: ./cmd/api
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: exec-agent
    binary: exec-agent
    main: ./cmd/exec-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Software Bill of Materials. syft generates a CycloneDX JSON SBOM per archive
# artifact (the format mandated by most enterprise/government supply-chain
# policies, e.g. CISA / EO 14028). Requires `syft` on PATH; goreleaser skips
# this stanza in `--snapshot` builds when syft is absent.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.cdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

# Keyless (Sigstore OIDC) signing of the checksums file. No private key is
# created or stored: cosign requests a short-lived OIDC token from the GitHub
# Actions runner (requires `id-token: write` in release.yml), exchanges it for
# an ephemeral Fulcio certificate, signs, and records the event in the Rekor
# transparency log. The resulting `checksums.txt.sigstore.json` bundle is a
# fully public artifact containing the cert + Rekor inclusion proof — no secret.
#
# Only `checksums.txt` is signed (not every archive): the checksum file pins
# every archive via SHA-256, so one bundle anchors the whole release. This is
# the pattern used by Helm, kubectl, and ko. Requires `cosign` on PATH;
# goreleaser skips this stanza in `--snapshot` builds when cosign is absent.
signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: moltbunker
    name: moltbunker
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}}-v{{.Version}}"

brews:
  - name: moltbunker
    repository:
      owner: moltbunker
      name: homebrew-tap
    homepage: https://github.com/moltbunker/moltbunker
    description: Permissionless, fully encrypted P2P network for containerized compute
    license: MIT
    install: |
      bin.install "moltbunker"
      bin.install "moltbunker-daemon"
      bin.install "moltbunker-api"

nfpms:
  - id: packages
    package_name: moltbunker
    vendor: Moltbunker
    homepage: https://github.com/moltbunker/moltbunker
    maintainer: Moltbunker Team <team@moltbunker.com>
    description: Permissionless, fully encrypted P2P network for containerized compute
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/local/bin

dockers:
  - id: daemon
    goos: linux
    goarch: amd64
    image_templates:
      - "moltbunker/moltbunker:{{ .Version }}-amd64"
      - "ghcr.io/moltbunker/moltbunker:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"

  - id: daemon-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "moltbunker/moltbunker:{{ .Version }}-arm64"
      - "ghcr.io/moltbunker/moltbunker:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"

docker_manifests:
  - name_template: "moltbunker/moltbunker:{{ .Version }}"
    image_templates:
      - "moltbunker/moltbunker:{{ .Version }}-amd64"
      - "moltbunker/moltbunker:{{ .Version }}-arm64"
  - name_template: "moltbunker/moltbunker:latest"
    image_templates:
      - "moltbunker/moltbunker:{{ .Version }}-amd64"
      - "moltbunker/moltbunker:{{ .Version }}-arm64"
  - name_template: "ghcr.io/moltbunker/moltbunker:{{ .Version }}"
    image_templates:
      - "ghcr.io/moltbunker/moltbunker:{{ .Version }}-amd64"
      - "ghcr.io/moltbunker/moltbunker:{{ .Version }}-arm64"
  - name_template: "ghcr.io/moltbunker/moltbunker:latest"
    image_templates:
      - "ghcr.io/moltbunker/moltbunker:{{ .Version }}-amd64"
      - "ghcr.io/moltbunker/moltbunker:{{ .Version }}-arm64"
