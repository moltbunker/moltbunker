[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moltbunker"
version = "0.1.0"
description = "Python SDK for the Moltbunker P2P encrypted container runtime"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Moltbunker", email = "dev@moltbunker.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
wallet = [
    "eth-account>=0.13",
    "web3>=7.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["moltbunker"]
