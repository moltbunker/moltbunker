name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # The L7 WAF dependency (github.com/corazawaf/coraza/v3) raises the repo Go
  # floor to 1.25 (go.mod: go 1.25.0 + toolchain go1.25.4). Keep this in sync.
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install DBus session helper
        # The 99designs/keyring package's KWallet backend init() opens a
        # session bus at package load time; runners don't provide one by
        # default. dbus-run-session creates a transient session for tests.
        run: sudo apt-get update && sudo apt-get install -y dbus-x11

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: dbus-run-session -- go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-moltbunker

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      # moltbunker targets Linux and macOS. The daemon depends on Linux-only
      # subsystems (containerd, namespaces, hypervisor integration) and Unix
      # syscalls (Statfs); a Windows build is not currently supported.
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/moltbunker-daemon-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/daemon

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o dist/moltbunker-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # tests/integration spins up a local chain with Anvil and deploys the
      # contracts with forge. Without Foundry the suite silently SKIPs
      # (integration_test.go: "SKIP: Foundry not installed"), so install it and
      # verify the binaries land where the tests look for them (~/.foundry/bin).
      - name: Install Foundry (anvil / forge / cast)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify Foundry toolchain
        run: |
          set -eux
          ls -l "$HOME/.foundry/bin/anvil" "$HOME/.foundry/bin/forge" "$HOME/.foundry/bin/cast"
          "$HOME/.foundry/bin/anvil" --version

      - name: Run integration tests
        run: go test -v -tags=integration -timeout 15m ./tests/...

  e2e-golden:
    name: Golden-path E2E
    # E2E-01: golden-path acceptance test. Non-required until proven stable on
    # 3+ consecutive green runs, after which drop continue-on-error and add to
    # branch protection. Uses the in-process mock containerd + MockEscrow/Staking
    # contracts + an in-process loopback ingress, so no containerd, anvil, or
    # external services are needed. Runs on every push and PR (no main-only guard).
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install DBus session helper
        # testutil.NewTestHarness pulls in the keyring package whose KWallet
        # backend init() opens a session bus at load time; provide a transient one.
        run: sudo apt-get update && sudo apt-get install -y dbus-x11

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-golden-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-golden-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run golden-path E2E (mocked legs)
        # MOLTBUNKER_ANVIL_RPC is intentionally unset, so the real-chain leg
        # (TestGoldenPath_EscrowAnvilMode) skips and the mock-mode legs run.
        run: dbus-run-session -- go test -v -tags e2e -timeout 120s -count=1 ./tests/e2e/golden/...

  runtime-e2e:
    name: Runtime E2E (Linux containerd)
    # R11: exercise the real ContainerdClient lifecycle against a live containerd
    # on Linux. Until now these tests (tests/e2e/colima, //go:build colima) ran
    # only against Colima on a developer's macOS and never in CI, so Linux
    # runtime regressions (containerd, snapshots, runc tasks) shipped unverified.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-e2e-
            ${{ runner.os }}-go-

      - name: Prepare containerd
        run: |
          set -euxo pipefail
          # ubuntu-latest ships a running containerd (used by Docker) at
          # /run/containerd/containerd.sock. Ensure it is installed + running and
          # grant the unprivileged runner user access to the socket so the e2e
          # client (which connects as the test process, not root) can reach it.
          if ! command -v containerd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y containerd runc
          fi
          # Start via systemd if available; otherwise launch a background daemon.
          # `|| true` keeps `set -e` from aborting when the unit is already active.
          sudo systemctl start containerd 2>/dev/null || true
          if [ ! -S /run/containerd/containerd.sock ]; then
            sudo sh -c 'containerd >/tmp/containerd.log 2>&1 &'
          fi
          # Wait (≤20s) for the socket to appear. The `if/fi` form is set -e safe.
          for _ in $(seq 1 40); do
            if [ -S /run/containerd/containerd.sock ]; then break; fi
            sleep 0.5
          done
          test -S /run/containerd/containerd.sock
          sudo chmod 666 /run/containerd/containerd.sock
          sudo ctr version

      - name: Run real-containerd E2E tests
        env:
          # tests/e2e/colima honors this override (colima_test.go: colimaSocket);
          # point it at the Linux runner's system containerd socket.
          COLIMA_CONTAINERD_SOCKET: /run/containerd/containerd.sock
        run: go test -tags colima -v -timeout 12m ./tests/e2e/colima/...

      - name: Install nftables
        # R13/R14: the nftables enforcer generates `nft -f -` scripts that the
        # unit tests only validate against a fake exec. Install the real nft
        # binary so the smoke test below pipes the real scripts to real nft and
        # catches chain-name rejections and the delete-chain EBUSY teardown bug.
        run: sudo apt-get update && sudo apt-get install -y nftables

      - name: Run nftables enforcer smoke test (real nft, root)
        # Needs CAP_NET_ADMIN; run as root via sudo. `-tags nftsmoke` selects the
        # gated smoke test (skipped from the default suite, which has no nft).
        # `go env GOFLAGS` are not inherited under sudo, so pass GOPATH/HOME so
        # the module cache and toolchain resolve under the runner's user.
        run: |
          set -euxo pipefail
          sudo env "PATH=$PATH" "HOME=$HOME" "GOPATH=$(go env GOPATH)" \
            go test -tags nftsmoke -v -run TestSmoke_ApplyRemoveAgainstRealNft \
            ./internal/networking/...
